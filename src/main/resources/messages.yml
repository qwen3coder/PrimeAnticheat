# ================= PrimeAnticheat messages.yml =================
# Palette: primary &#58A8FF | accent &#007AFF | + &#00FF00 | - &#F43F5E | text &#94A3B8
# Prefix and " » " separator are prepended by code (configs.prefixLine),
# don't write them into templates.
prefix: "&#0079FFP&#0A7EFFr&#1484FFi&#1D89FFm&#278EFFe"

no-permission: "&#F43F5ENo permission."
